name: Build Cue Station
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler l'appli
        run: |
          bash build.sh
      - name: Fabriquer le DMG
        run: |
          mkdir -p dmg
          cp -R "dist/Cue Station.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Cue Station" -srcfolder dmg -ov -format UDZO "dist/Cue-Station.dmg"
          cp "dist/Cue-Station.dmg" "dist/Buzzer-Trigger.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Cue-Station
          path: dist/Cue-Station.dmg
      - name: Publier en téléchargement
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Cue Station
          files: |
            dist/Cue-Station.dmg
            dist/Buzzer-Trigger.dmg
